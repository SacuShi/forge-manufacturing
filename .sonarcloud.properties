# SonarQube Cloud automatic analysis settings (this file, not sonar-project.properties, is what automatic analysis reads).

sonar.sources=.
sonar.tests=.

# Test code: reported as tests, not as production bugs/vulnerabilities.
sonar.test.inclusions=server/test/**,server/test-*.js,forge-v1/src/**/__tests__/**,forge-v1/src/**/*.test.ts,forge-v1/src/**/*.test.tsx,forge-v1/src/test-setup.ts

# Not production code: the tests above, and the old single-file prototype in frontend/ (the live site is built from forge-v1).
sonar.exclusions=server/test/**,server/test-*.js,forge-v1/src/**/__tests__/**,forge-v1/src/**/*.test.ts,forge-v1/src/**/*.test.tsx,forge-v1/src/test-setup.ts,frontend/**

sonar.sourceEncoding=UTF-8
