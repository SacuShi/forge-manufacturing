<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>F.O.R.G.E. — EVE Manufacturing Advisor</title>
  <meta name="description" content="F.O.R.G.E. — AI-powered manufacturing advisor for EVE Online. Connect your account and get personalised advice on build chains, profitability, and material planning.">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.tailwindcss.com https://unpkg.com; style-src 'self' 'unsafe-inline'; connect-src 'self' https://login.eveonline.com https://esi.evetech.net https://evetycoon.com https://forge-ukc.com; img-src 'self' data: https: blob:; font-src 'self' data:;">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    /* Theme CSS Variables */
    :root {
      --bg-primary: #030712;
      --bg-secondary: #0a0f1a;
      --bg-tertiary: #1a1f2e;
      --border-color: #1e293b;
      --text-primary: #94a3b8;
      --text-secondary: #475569;
      --text-tertiary: #334155;
      --accent-cyan: #22d3ee;
      --accent-green: #34d399;
      --accent-orange: #fb923c;
      --accent-purple: #c084fc;
      --scrollbar-track: #0a0f1a;
      --scrollbar-thumb: #1e3a5f;
      --scrollbar-thumb-hover: #2a5a8a;
    }

    [data-theme="light"] {
      --bg-primary: #f8fafc;
      --bg-secondary: #f1f5f9;
      --bg-tertiary: #e2e8f0;
      --border-color: #cbd5e1;
      --text-primary: #334155;
      --text-secondary: #64748b;
      --text-tertiary: #94a3b8;
      --accent-cyan: #0891b2;
      --accent-green: #059669;
      --accent-orange: #ea580c;
      --accent-purple: #9333ea;
      --scrollbar-track: #e2e8f0;
      --scrollbar-thumb: #94a3b8;
      --scrollbar-thumb-hover: #64748b;
    }

    body { margin: 0; background: var(--bg-primary); transition: background 0.3s; }
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: var(--scrollbar-track); }
    ::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--scrollbar-thumb-hover); }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spin { animation: spin 1.2s linear infinite; display: inline-block; }
    @keyframes fade-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    .fade-in { animation: fade-in 0.4s ease forwards; }
  </style>
</head>
<body>
  <div id="root"></div>

<script type="text/babel">
const { useState, useRef, useEffect, useCallback } = React;

// ── Config ─────────────────────────────────────────────────────────────────────
// Replace YOUR_EVE_CLIENT_ID_HERE with your actual EVE Client ID from https://developers.eveonline.com/applications
const EVE_CLIENT_ID = "5be8a3b3444a4413b7f82b45c2c54a26";
const SCOPES = "esi-assets.read_assets.v1 esi-characters.read_blueprints.v1 esi-wallet.read_character_wallet.v1 esi-industry.read_character_jobs.v1";
const ESI = "https://esi.evetech.net/latest";

// API helper - points to your Ubuntu server
const API_BASE = "https://FORGE-UKC.com";
const api = async (endpoint, options = {}) => {
  return fetch(`${API_BASE}${endpoint}`, {
    headers: { "Content-Type": "application/json" },
    ...options
  });
};

// Authenticated API helper - includes EVE token
const authApi = async (endpoint, token, options = {}) => {
  return fetch(`${API_BASE}${endpoint}`, {
    ...options,
    headers: { 
      "Content-Type": "application/json",
      "Authorization": `Bearer ${token}`,
      ...(options.headers || {})
    }
  });
};

// ── ESI Helpers ────────────────────────────────────────────────────────────────
const esiGet = async (path, tok, page = 1) => {
  const sep = path.includes("?") ? "&" : "?";
  const r = await fetch(`${ESI}${path}${sep}datasource=tranquility&page=${page}`,
    tok ? { headers: { Authorization: `Bearer ${tok}` } } : {});
  if (!r.ok) throw new Error(`ESI error ${r.status}: ${path}`);
  return { data: await r.json(), pages: +(r.headers.get("x-pages") || 1) };
};

const fetchAll = async (path, tok) => {
  const { data, pages } = await esiGet(path, tok);
  if (pages === 1) return data;
  const rest = await Promise.all(
    Array.from({ length: pages - 1 }, (_, i) => esiGet(path, tok, i + 2).then(r => r.data))
  );
  return [...data, ...rest.flat()];
};

const resolveNames = async (ids) => {
  const uniq = [...new Set(ids.filter(Boolean))];
  const result = {};
  for (let i = 0; i < uniq.length; i += 1000) {
    try {
      const r = await fetch(`${ESI}/universe/names/?datasource=tranquility`, {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify(uniq.slice(i, i + 1000))
      });
      if (r.ok) (await r.json()).forEach(n => result[n.id] = n.name);
    } catch {}
  }
  return result;
};

const fmtN   = n => typeof n === "number" ? n.toLocaleString() : (n ?? "—");
const fmtISK = n => {
  if (!n) return "—";
  if (Math.abs(n) >= 1e12) return (n/1e12).toFixed(2)+"T";
  if (Math.abs(n) >= 1e9)  return (n/1e9).toFixed(2)+"B";
  if (Math.abs(n) >= 1e6)  return (n/1e6).toFixed(1)+"M";
  if (Math.abs(n) >= 1e3)  return (n/1e3).toFixed(0)+"K";
  return Math.round(n).toString();
};

const mkState = () => {
  const a = new Uint8Array(16); crypto.getRandomValues(a);
  return Array.from(a).map(b => b.toString(16).padStart(2,"0")).join("");
};

// ── Loading Animation Component ───────────────────────────────────────────────
function LoadingIndicator() {
  const [statusIndex, setStatusIndex] = useState(0);
  const [ledState, setLedState] = useState(Array(9).fill(false));
  
  const statusMessages = [
    "Checking blueprints...",
    "Loading market data...",
    "Analyzing assets...",
    "Calculating profitability...",
    "Processing results..."
  ];
  
  useEffect(() => {
    // Cycle through status messages every 800ms
    const statusTimer = setInterval(() => {
      setStatusIndex(i => (i + 1) % statusMessages.length);
    }, 800);
    
    // Flash random LEDs every 100ms (like network activity)
    const ledTimer = setInterval(() => {
      setLedState(Array(9).fill(false).map(() => Math.random() > 0.7));
    }, 100);
    
    return () => {
      clearInterval(statusTimer);
      clearInterval(ledTimer);
    };
  }, []);
  
  return (
    <div style={{ display: "flex" }}>
      <div style={{ 
        padding: "10px 12px", 
        borderRadius: 4, 
        background: "#0a0f1a", 
        border: "1px solid #1e293b", 
        color: "#334155", 
        fontSize: 11,
        display: "flex",
        alignItems: "center",
        gap: 10
      }}>
        {/* 3x3 LED Grid */}
        <div style={{ 
          display: "grid", 
          gridTemplateColumns: "repeat(3, 3px)", 
          gap: 1.5 
        }}>
          {ledState.map((on, i) => (
            <div 
              key={i}
              style={{ 
                width: 3, 
                height: 3, 
                borderRadius: 1,
                background: on ? "#22d3ee" : "#0f172a",
                boxShadow: on ? "0 0 3px #22d3ee" : "none",
                transition: "all 0.05s"
              }} 
            />
          ))}
        </div>
        
        {/* Status Message */}
        <span style={{ color: "#64748b" }}>
          ⟳ {statusMessages[statusIndex]}
        </span>
      </div>
    </div>
  );
}

// ── ChatMessage ───────────────────────────────────────────────────────────────
// Memoized per-message component. React.memo means it only re-renders if the
// message content actually changes — which it never does once received.
// The inner useMemo means parseMessageWithLinks runs exactly ONCE per message, ever.
const ChatMessage = React.memo(({ message, parseMessageWithLinks, loadItemDetails }) => {
  const parsed = React.useMemo(() =>
    message.role === "assistant" ? parseMessageWithLinks(message.content) : null,
    [message.content] // eslint-disable-line react-hooks/exhaustive-deps
  );

  return (
    <div style={{ display: "flex", justifyContent: message.role === "user" ? "flex-end" : "flex-start" }}>
      <div style={{
        maxWidth: "95%", padding: "10px 12px", borderRadius: 4, fontSize: 12,
        lineHeight: 1.6, whiteSpace: "pre-wrap",
        background: message.role === "user" ? "#0c2a4a" : "#0a0f1a",
        border: `1px solid ${message.role === "user" ? "#164e63" : "#1e293b"}`,
        color: message.role === "user" ? "#7dd3fc" : "#94a3b8"
      }}>
        {message.role === "assistant" && (
          <div style={{ color: "#1e3a5f", fontSize: 9, letterSpacing: 2, marginBottom: 4 }}>◉ ADVISOR</div>
        )}
        {message.role === "assistant" ? parsed : message.content}
      </div>
    </div>
  );
});

// ── App ────────────────────────────────────────────────────────────────────────
function App() {
  const mono = { fontFamily: "'Courier New', 'Lucida Console', monospace" };

  // Auth state: 'idle' | 'exchanging' | 'loading' | 'authed' | 'error'
  const [authState, setAuthState] = useState("idle");
  const [loadStep,  setLoadStep]  = useState("");
  const [authError, setAuthError] = useState("");

  // Character data
  const [token,      setToken]      = useState(null);
  const [charName,   setCharName]   = useState("");
  const [characterId, setCharacterId] = useState(null);
  const [historyLoaded, setHistoryLoaded] = useState(false);
  const [assets,     setAssets]     = useState([]);
  const [blueprints, setBlueprints] = useState([]);
  const [jobs,       setJobs]       = useState([]);
  const [wallet,     setWallet]     = useState(null);
  const [nameMap,    setNameMap]    = useState({});
  const [prices,     setPrices]     = useState({});
  const [bpMaterials, setBpMaterials] = useState({});
  const [dataLog,    setDataLog]    = useState([]);
  const [selectedItem, setSelectedItem] = useState(null); // For right panel item details
  const [itemDetails, setItemDetails] = useState(null);   // Item data from API
  const [allItemNames, setAllItemNames] = useState({});   // Full EVE item database
  const [blueprintDb, setBlueprintDb] = useState({});     // Full blueprint database with materials

  // UI
  const [tab,         setTab]        = useState("assets");
  const [assetSearch, setAssetSearch] = useState("");
  const [bpSearch,    setBpSearch]   = useState("");
  const [bpFilter,    setBpFilter]   = useState("all");
  const [showAbout,   setShowAbout]  = useState(false);
  const [theme,       setTheme]      = useState(() => localStorage.getItem('forge-theme') || 'dark');

  // Chat
  const [messages,  setMessages]  = useState([{
    role: "assistant",
    content: "F.O.R.G.E. is ready, Capsuleer.\n\nI have your blueprint library and asset hold loaded. Ask me anything — what to build for maximum profit, what materials you're missing, which build chains make sense with what you have, or anything else about your manufacturing operation."
  }]);
  const [input,    setInput]    = useState("");
  const [thinking, setThinking] = useState(false);
  const chatEnd = useRef(null);
  const scroll  = () => setTimeout(() => chatEnd.current?.scrollIntoView({ behavior: "smooth" }), 60);
  
  // PERFORMANCE: Limit message history to prevent slowdown
  const MAX_MESSAGES = 50;
  useEffect(() => {
    if (messages.length > MAX_MESSAGES) {
      // Keep welcome message + last 49 messages
      setMessages([messages[0], ...messages.slice(-49)]);
    }
  }, [messages]);

  // Theme management
  useEffect(() => {
    document.documentElement.setAttribute('data-theme', theme);
    localStorage.setItem('forge-theme', theme);
  }, [theme]);

  const toggleTheme = () => {
    setTheme(prev => prev === 'dark' ? 'light' : 'dark');
  };

  // ── Performance: Pre-compute expensive lookups ONCE when data changes ────────
  // Without these, every keystroke triggers a full rebuild of 52K item name maps

  // Build a trie from nameMap (user's own items only — a few hundred, not 52K)
  // Each node is a letter; _end nodes carry { typeId, name } for confirmed matches.
  // Build trie with alias support for common EVE player abbreviations.
  // Aliases insert extra paths into the trie so "cyno field generator" finds
  // "Cynosural Field Generator" and "cap recharger" finds "Capacitor Recharger".
  // Items whose real names already start with the abbreviation (e.g. "Cap Booster 800")
  // are unaffected — they live in the trie under their real name as normal.
  // If "cap xyz" isn't a real item in either form, the trie walk just fails — no link.
  const itemTrie = React.useMemo(() => {
    const aliases = {
      'capacitor': 'cap',
      'cynosural': 'cyno',
      'afterburner': 'ab',
    };

    const trie = {};

    const insertName = (name, typeId, displayName) => {
      const lower = name.toLowerCase();
      let node = trie;
      for (const char of lower) {
        if (!node[char]) node[char] = {};
        node = node[char];
      }
      if (!node._end) node._end = { typeId, name: displayName };
    };

    const source = Object.keys(allItemNames).length > 0 ? allItemNames : nameMap;

    Object.entries(source).forEach(([id, name]) => {
      const typeId = parseInt(id);
      const lower = name.toLowerCase();
      insertName(name, typeId, name);
      for (const [full, abbrev] of Object.entries(aliases)) {
        if (lower.startsWith(full + ' ')) {
          const aliasName = abbrev + name.substring(full.length);
          insertName(aliasName, typeId, name);
        }
      }
    });

    return trie;
  }, [allItemNames, nameMap]);

  // Asset groups: only recalculate when assets, nameMap, or search changes
  const assetGroups = React.useMemo(() => {
    const g = {};
    assets.forEach(a => { const n = nameMap[a.type_id] || `ID:${a.type_id}`; g[n] = (g[n] || 0) + a.quantity; });
    return Object.entries(g).sort((a, b) => b[1] - a[1])
      .filter(([n]) => !assetSearch || n.toLowerCase().includes(assetSearch.toLowerCase()));
  }, [assets, nameMap, assetSearch]);

  // Filtered blueprints: only recalculate when blueprints, nameMap, or filter changes
  const filtBps = React.useMemo(() => {
    return blueprints.filter(b => {
      const n  = nameMap[b.type_id] || "";
      const ms = !bpSearch  || n.toLowerCase().includes(bpSearch.toLowerCase());
      const mf = bpFilter === "all" || (bpFilter === "bpo" ? b.runs === -1 : b.runs !== -1);
      return ms && mf;
    }).sort((a, b) => b.material_efficiency - a.material_efficiency);
  }, [blueprints, nameMap, bpSearch, bpFilter]);

  // Top 8 assets by quantity for dashboard panel
  const topAssets = React.useMemo(() => {
    const g = {};
    assets.forEach(a => { const n = nameMap[a.type_id] || `ID:${a.type_id}`; g[n] = (g[n] || 0) + a.quantity; });
    return Object.entries(g).sort((a, b) => b[1] - a[1]).slice(0, 8);
  }, [assets, nameMap]);

  // Top blueprints for dashboard panel
  const topBps = React.useMemo(() => {
    return blueprints.slice(0, 6)
      .sort((a, b) => (nameMap[b.type_id] || "").localeCompare(nameMap[a.type_id] || ""))
      .map(b => ({
        name: nameMap[b.type_id] || `Type ${b.type_id}`,
        runs: b.runs === -1 ? "BPO" : `${b.runs}r`,
        me: b.material_efficiency,
        te: b.time_efficiency
      }));
  }, [blueprints, nameMap]);

  // Total unique asset types count
  const totalAssetTypes = React.useMemo(() => new Set(assets.map(a => a.type_id)).size, [assets]);

  // ── OAuth callback detection ─────────────────────────────────────────────
  useEffect(() => {
    const params = new URLSearchParams(window.location.search);
    const code   = params.get("code");
    const state  = params.get("state");
    if (!code) return;

    // Clean the URL immediately so refresh doesn't re-trigger
    window.history.replaceState({}, "", window.location.pathname);

    const savedState = sessionStorage.getItem("forge_oauth_state");
    sessionStorage.removeItem("forge_oauth_state");

    if (savedState && state !== savedState) {
      setAuthError("Security check failed (state mismatch). Please try logging in again.");
      setAuthState("error");
      return;
    }

    handleOAuthCallback(code);
  }, []);

  // Load full EVE item names database (once per browser, cached in localStorage)
  useEffect(() => {
    const loadItemNames = async () => {
      // Try localStorage first
      const cached = localStorage.getItem('forge_item_names');
      if (cached) {
        try {
          const parsed = JSON.parse(cached);
          const count = Object.keys(parsed).length;
          
          // Reject stale cache with too few items (should be 40K+)
          if (count < 10000) {
            console.warn(`Cache has only ${count} items - clearing stale cache`);
            localStorage.removeItem('forge_item_names');
          } else {
            setAllItemNames(parsed);
            console.log(`✓ Loaded ${count} item names from cache`);
            return;
          }
        } catch (e) {
          console.warn('Failed to parse cached item names');
          localStorage.removeItem('forge_item_names');
        }
      }

      // Not cached - fetch from server
      try {
        console.log('⟳ Downloading EVE item database...');
        const res = await fetch(API_BASE + '/api/item-names');
        const data = await res.json();
        
        if (data.items && Object.keys(data.items).length > 0) {
          setAllItemNames(data.items);
          localStorage.setItem('forge_item_names', JSON.stringify(data.items));
          console.log(`✓ Loaded ${Object.keys(data.items).length} item names from server`);
        }
      } catch (e) {
        console.error('Failed to load item names database:', e);
      }
    };

    loadItemNames();
  }, []);

  // Load global Jita prices (cached on server, updated hourly)
  useEffect(() => {
    const loadJitaPrices = async () => {
      try {
        console.log('⟳ Loading Jita prices from cache...');
        const res = await fetch(API_BASE + '/api/jita-prices');
        const data = await res.json();
        
        if (data.prices && Object.keys(data.prices).length > 0) {
          setPrices(data.prices);
          console.log(`✓ Loaded ${Object.keys(data.prices).length} Jita prices`);
        }
      } catch (e) {
        console.error('Failed to load Jita prices:', e);
      }
    };

    loadJitaPrices();
  }, []);

  // Load blueprint database (cached on server, updated daily)
  useEffect(() => {
    const loadBlueprintDb = async () => {
      try {
        console.log('⟳ Loading blueprint database...');
        const res = await fetch(API_BASE + '/api/blueprint-database');
        const data = await res.json();
        
        if (data.blueprints && Object.keys(data.blueprints).length > 0) {
          setBlueprintDb(data.blueprints);
          console.log(`✓ Loaded ${Object.keys(data.blueprints).length} blueprint recipes`);
        }
      } catch (e) {
        console.error('Failed to load blueprint database:', e);
      }
    };

    loadBlueprintDb();
  }, []);

  // Match user blueprints with database materials (runs after both load)
  useEffect(() => {
    if (blueprints.length > 0 && Object.keys(blueprintDb).length > 0) {
      console.log('⟳ Matching blueprint materials...');
      const userMaterials = {};
      
      blueprints.forEach(bp => {
        const bpId = bp.type_id;
        if (blueprintDb[bpId]) {
          userMaterials[bpId] = blueprintDb[bpId].materials;
        }
      });
      
      setBpMaterials(userMaterials);
      const count = Object.keys(userMaterials).length;
      console.log(`✓ Matched materials for ${count}/${blueprints.length} owned blueprints`);
    }
  }, [blueprints, blueprintDb]); // Runs when either changes

  const handleOAuthCallback = async (code) => {
    setAuthState("exchanging");
    setLoadStep("Verifying login with EVE...");
    try {
      const redirectUri = window.location.origin + window.location.pathname;
      const res = await api("/api/eve-token", {
        method: "POST",
        body: JSON.stringify({ code, redirect_uri: redirectUri })
      });
      const data = await res.json();
      if (!res.ok || data.error) throw new Error(data.error || "Token exchange failed");
      await loadCharacterData(data.access_token);
    } catch (e) {
      setAuthError(e.message);
      setAuthState("error");
    }
  };

  const startLogin = () => {
    const state = mkState();
    sessionStorage.setItem("forge_oauth_state", state);
    const redirectUri = window.location.origin + window.location.pathname;
    const params = new URLSearchParams({
      response_type: "code",
      client_id:     EVE_CLIENT_ID,
      redirect_uri:  redirectUri,
      scope:         SCOPES,
      state
    });
    window.location.href = `https://login.eveonline.com/v2/oauth/authorize?${params}`;
  };

  // ── Data Loading ───────────────────────────────────────────────────────────
  const loadCharacterData = async (acc) => {
    setToken(acc);
    setAuthState("loading");
    const log = [];
    const addLog = (label, status, detail) => {
      log.push({ label, status, detail });
      setDataLog([...log]);
    };

    try {
      // Decode character ID from JWT
      const jwtPart = acc.split(".")[1].replace(/-/g, "+").replace(/_/g, "/");
      const pad     = "==".slice(0, (4 - jwtPart.length % 4) % 4);
      const payload = JSON.parse(atob(jwtPart + pad));
      const cid     = parseInt((payload.sub || "").replace("CHARACTER:EVE:", ""));

      setLoadStep("Loading character...");
      const cr = await fetch(`${ESI}/characters/${cid}/?datasource=tranquility`);
      const cd = await cr.json();
      setCharName(cd.name);
      setCharacterId(cid);
      addLog("Character", "ok", cd.name);

      let aData = [], bData = [], w = 0, active = [];

      setLoadStep("Scanning asset hold...");
      try {
        aData = await fetchAll(`/characters/${cid}/assets/`, acc);
        setAssets(aData);
        addLog("Assets", aData.length > 0 ? "ok" : "warn",
          `${aData.length} stacks${aData.length === 0 ? " — check scopes, or assets may be in corp hangars" : ""}`);
      } catch(e) { addLog("Assets", "err", e.message); }

      setLoadStep("Cataloguing blueprints...");
      try {
        bData = await fetchAll(`/characters/${cid}/blueprints/`, acc);
        setBlueprints(bData);
        addLog("Blueprints", bData.length > 0 ? "ok" : "warn",
          `${bData.length} blueprints${bData.length === 0 ? " — check scopes, or BPs may be in corp hangar" : ""}`);
      } catch(e) { addLog("Blueprints", "err", e.message); }

      setLoadStep("Checking industry jobs...");
      try {
        const { data: jData } = await esiGet(`/characters/${cid}/industry/jobs/?include_completed=false`, acc);
        active = jData.filter(j => j.status === "active");
        setJobs(active);
        addLog("Industry Jobs", "ok", `${active.length} active`);
      } catch(e) { addLog("Industry Jobs", "err", e.message); setJobs([]); }

      setLoadStep("Reading wallet...");
      try {
        const wr = await fetch(`${ESI}/characters/${cid}/wallet/?datasource=tranquility`,
          { headers: { Authorization: `Bearer ${acc}` } });
        w = await wr.json();
        setWallet(w);
        addLog("Wallet", "ok", `${fmtISK(w)} ISK`);
      } catch(e) { addLog("Wallet", "err", e.message); }

      setLoadStep("Resolving item names...");

  // Parse AI message and make item names clickable using the trie.
  // At each position in the text, we walk the trie one letter at a time.
  // If the current character isn't in the trie at that level, we bail immediately —
  // no need to check any other item names. Scan happens once per message ever,
  // because ChatMessage (below) memoizes the result.
  const boundaryChars = /[\s\-,.|*()[\]{}:;"'`!?/\\]/;

  const parseMessageWithLinks = (text) => {
    if (!text) return text;

    const lines = text.split('\n');

    return lines.map((line, lineIdx) => {
      const parts = [];
      let currentText = "";
      let searchPos = 0;

      while (searchPos < line.length) {
        // Only attempt a trie walk if we're at a word boundary
        const charBefore = searchPos > 0 ? line[searchPos - 1] : ' ';
        if (searchPos === 0 || boundaryChars.test(charBefore)) {
          // Walk the trie from this position
          let node = itemTrie;
          let pos = searchPos;
          let lastMatch = null;

          while (pos < line.length) {
            const char = line[pos].toLowerCase();
            if (!node[char]) break; // No items start with these letters — bail immediately
            node = node[char];
            pos++;

            if (node._end) {
              // Potential match — check word boundary after
              const charAfter = pos < line.length ? line[pos] : ' ';
              // Allow match if followed by boundary char OR by 's' then boundary (for plurals)
              const isValidBoundary = boundaryChars.test(charAfter) || 
                (charAfter === 's' && (pos + 1 >= line.length || boundaryChars.test(line[pos + 1])));
              if (isValidBoundary) {
                // Valid complete word match — record it (keep going in case longer match exists)
                lastMatch = { typeId: node._end.typeId, name: node._end.name, end: pos };
              }
            }
          }

          if (lastMatch) {
            // Flush accumulated plain text before the match
            if (currentText) {
              parts.push(<span key={`text-${lineIdx}-${parts.length}`}>{currentText}</span>);
              currentText = "";
            }
            // Add clickable link
            const actualText = line.substring(searchPos, lastMatch.end);
            parts.push(
              <span
                key={`item-${lineIdx}-${parts.length}-${lastMatch.typeId}`}
                onClick={() => loadItemDetails(lastMatch.typeId, lastMatch.name)}
                style={{ color: "#22d3ee", textDecoration: "underline", cursor: "pointer", fontWeight: 600 }}
                onMouseOver={e => e.target.style.color = "#7dd3fc"}
                onMouseOut={e => e.target.style.color = "#22d3ee"}
              >
                {actualText}
              </span>
            );
            searchPos = lastMatch.end;
            continue;
          }
        }

        // No match at this position — accumulate character as plain text
        currentText += line[searchPos];
        searchPos++;
      }

      if (currentText) {
        parts.push(<span key={`text-${lineIdx}-${parts.length}`}>{currentText}</span>);
      }

      return <div key={`line-${lineIdx}`}>{parts.length > 0 ? parts : line}</div>;
    });
  };

                  return (
                    <div key={i} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "5px 0", borderBottom: "1px solid #0f172a", gap: 6 }}>
                      <div style={{ color: "#64748b", fontSize: 12, flex: 1, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{n}</div>
                      <div style={{ display: "flex", gap: 3, flexShrink: 0 }}>
                        <span style={{ fontSize: 10, padding: "1px 6px", borderRadius: 3, background: isBpo?"#0c4a6e":"#1e293b", color: isBpo?"#22d3ee":"#475569" }}>{isBpo?"BPO":`${b.runs}r`}</span>
                        <span style={{ fontSize: 10, padding: "1px 6px", borderRadius: 3, background: "#052e16", color: "#34d399" }}>ME{b.material_efficiency}</span>
                        <span style={{ fontSize: 10, padding: "1px 6px", borderRadius: 3, background: "#411c00", color: "#fb923c" }}>TE{b.time_efficiency}</span>
                      </div>
                    </div>
                  );
                })}
                {filtBps.length === 0 && <div style={{ color: "#1e3a5f", fontSize: 12, padding: 16, textAlign: "center" }}>No blueprints match</div>}
              </div>
            </div>

            {/* Assets */}
            <div style={{ background: "#0a0f1a", border: "1px solid #1e293b", borderRadius: 4, padding: 12, maxHeight: 460, display: "flex", flexDirection: "column" }}>
              <div style={{ color: "#22d3ee", fontSize: 10, fontWeight: 700, letterSpacing: 3, textTransform: "uppercase", marginBottom: 8 }}>◉ Asset Hold ({fmtN(assets.length)} stacks)</div>
              <input value={assetSearch} onChange={e => setAssetSearch(e.target.value)} placeholder="Search assets..." className={`${inp} mb-2`} style={{ marginBottom: 8 }} />
              <div style={{ overflow: "auto", flex: 1 }}>
                {assetGroups.slice(0, 500).map(([name, qty], i) => (
                  <div key={i} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "5px 0", borderBottom: "1px solid #0f172a" }}>
                    <div style={{ color: "#64748b", fontSize: 12, flex: 1, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap", marginRight: 8 }}>{name}</div>
                    <div style={{ color: "#22d3ee", fontSize: 12, fontWeight: 700, flexShrink: 0 }}>{fmtN(qty)}</div>
                  </div>
                ))}
                {assetGroups.length === 0 && <div style={{ color: "#1e3a5f", fontSize: 12, padding: 16, textAlign: "center" }}>No assets match</div>}
              </div>
            </div>
          </div>

          {/* Active jobs */}
          {jobs.length > 0 && (
            <div style={{ background: "#0a0f1a", border: "1px solid #1e293b", borderRadius: 4, padding: 12, marginTop: 12 }}>
              <div style={{ color: "#fb923c", fontSize: 10, fontWeight: 700, letterSpacing: 3, textTransform: "uppercase", marginBottom: 8 }}>ACTIVE INDUSTRY JOBS ({jobs.length})</div>
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: "0 24px" }}>
                {jobs.slice(0, 20).map((j, i) => (
                  <div key={i} style={{ display: "flex", justifyContent: "space-between", padding: "4px 0", borderBottom: "1px solid #0f172a" }}>
                    <span style={{ color: "#475569", fontSize: 12, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap", marginRight: 8 }}>
                      {nameMap[j.product_type_id] || allItemNames[j.product_type_id] || `Product ${j.product_type_id}`}
                    </span>
                    <span style={{ color: "#fb923c", fontSize: 12, fontWeight: 700 }}>×{j.runs}</span>
                  </div>
                ))}
              </div>
            </div>
          )}
        </>)}

        {/* ══ ADVISOR ══ */}
        {tab === "advisor" && (() => {
          return (
            <div style={{ width: "100%", display: "grid", gridTemplateColumns: "1fr 1.2fr", gap: 16, height: "calc(100vh - 170px)" }}>
              
              {/* LEFT: Chat */}
              <div style={{ display: "flex", flexDirection: "column" }}>
                {/* Quick prompts */}
                <div style={{ display: "flex", gap: 6, marginBottom: 10, flexWrap: "wrap" }}>
                  {quickPrompts.map((q, i) => (
                    <button key={i} onClick={() => setInput(q)}
                      style={{ ...mono, padding: "4px 10px", border: "1px solid #1e293b", borderRadius: 4, background: "transparent", color: "#0e7490", fontSize: 10, cursor: "pointer" }}>
                      {q.length > 35 ? q.slice(0,35)+"..." : q}
                    </button>
                  ))}
                </div>

                {/* Messages */}
                <div style={{ flex: 1, overflow: "auto", display: "flex", flexDirection: "column", gap: 8, marginBottom: 10 }}>
                  {messages.map((m, i) => (
                    <ChatMessage
                      key={i}
                      message={m}
                      parseMessageWithLinks={parseMessageWithLinks}
                      loadItemDetails={loadItemDetails}
                    />
                  ))}
                  {thinking && <LoadingIndicator />}
                  <div ref={chatEnd} />
                </div>

                {/* Input */}
                <div style={{ display: "flex", gap: 6 }}>
                  <input
                    value={input} onChange={e => setInput(e.target.value)}
                    onKeyDown={e => e.key === "Enter" && !e.shiftKey && (e.preventDefault(), sendMsg())}
                    placeholder="Ask a question..."
                    className={inp} style={{ flex: 1, fontSize: 12, padding: "8px 10px" }}
                  />
                  <button onClick={clearHistory}
                    style={{ ...mono, padding: "8px 12px", fontSize: 10, fontWeight: 700, letterSpacing: 1, textTransform: "uppercase", borderRadius: 4, border: "1px solid #7f1d1d", background: "#450a0a", color: "#f87171", cursor: "pointer", flexShrink: 0 }}>
                    CLEAR HISTORY
                  </button>
                  <button onClick={sendMsg} disabled={!input.trim() || thinking}
                    style={{ ...mono, padding: "8px 14px", fontSize: 10, fontWeight: 700, letterSpacing: 1, textTransform: "uppercase", borderRadius: 4, border: `1px solid ${input.trim()&&!thinking?"#0e7490":"#1e293b"}`, background: "transparent", color: input.trim()&&!thinking?"#22d3ee":"#334155", cursor: input.trim()&&!thinking?"pointer":"not-allowed", flexShrink: 0 }}>
                    SEND
                  </button>
                </div>
                
                {/* Privacy Notice */}
                <div style={{ padding: "6px", fontSize: 9, color: "#475569", textAlign: "center", borderTop: "1px solid #1e293b" }}>
                  Chat history is encrypted and stored securely
                </div>
              </div>

              {/* RIGHT: Dashboard */}
              <div style={{ 
                display: "flex", 
                flexDirection: "column", 
                gap: 10, 
                overflow: "auto", 
                paddingRight: 4,
                position: "sticky",
                top: 0,
                alignSelf: "flex-start",
                maxHeight: "calc(100vh - 170px)"
              }}>
                
                {/* Key stats */}
                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8 }}>
                  <div style={{ background: "#0a0f1a", border: "1px solid #1e293b", borderRadius: 4, padding: 10 }}>
                    <div style={{ color: "#334155", fontSize: 9, letterSpacing: 2, marginBottom: 4 }}>WALLET</div>
                    <div style={{ color: "#34d399", fontSize: 16, fontWeight: 700 }}>{fmtISK(wallet)}</div>
                  </div>
                  <div style={{ background: "#0a0f1a", border: "1px solid #1e293b", borderRadius: 4, padding: 10 }}>
                    <div style={{ color: "#334155", fontSize: 9, letterSpacing: 2, marginBottom: 4 }}>BLUEPRINTS</div>
                    <div style={{ color: "#22d3ee", fontSize: 16, fontWeight: 700 }}>{blueprints.length}</div>
                  </div>
                  <div style={{ background: "#0a0f1a", border: "1px solid #1e293b", borderRadius: 4, padding: 10 }}>
                    <div style={{ color: "#334155", fontSize: 9, letterSpacing: 2, marginBottom: 4 }}>ITEMS</div>
                    <div style={{ color: "#fb923c", fontSize: 16, fontWeight: 700 }}>{totalAssetTypes}</div>
                  </div>
                  <div style={{ background: "#0a0f1a", border: "1px solid #1e293b", borderRadius: 4, padding: 10 }}>
                    <div style={{ color: "#334155", fontSize: 9, letterSpacing: 2, marginBottom: 4 }}>STACKS</div>
                    <div style={{ color: "#c084fc", fontSize: 16, fontWeight: 700 }}>{assets.length}</div>
                  </div>
                </div>

                {/* Item Details Panel (when item selected) */}
                {selectedItem && (
                  <div style={{ background: "#0a0f1a", border: "2px solid #0e7490", borderRadius: 6, padding: 12 }}>
                    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>
                      <div style={{ color: "#22d3ee", fontSize: 11, fontWeight: 700, letterSpacing: 2 }}>◉ {selectedItem.name.toUpperCase()}</div>
                      <button 
                        onClick={() => { setSelectedItem(null); setItemDetails(null); }}
                        style={{ background: "transparent", border: "none", color: "#475569", cursor: "pointer", fontSize: 16 }}
                      >×</button>
                    </div>
                    
                    {itemDetails ? (
                      <>
                        {/* Item Icon */}
                        {itemDetails.iconUrl && (
                          <div style={{ display: "flex", justifyContent: "center", marginBottom: 12 }}>
                            <img src={itemDetails.iconUrl} alt={selectedItem.name} style={{ width: 64, height: 64, border: "1px solid #1e293b", borderRadius: 4 }} />
                          </div>
                        )}
                        
                        {/* Price History Chart (simple sparkline) */}
                        {itemDetails.priceHistory && itemDetails.priceHistory.length > 0 && (() => {
                          const prices = itemDetails.priceHistory.map(d => d.average);
                          const min = Math.min(...prices);
                          const max = Math.max(...prices);
                          const range = max - min;
                          const latest = prices[prices.length - 1];
                          
                          return (
                            <div style={{ marginBottom: 12 }}>
                              <div style={{ color: "#334155", fontSize: 9, letterSpacing: 2, marginBottom: 6 }}>JITA PRICE (90 DAYS)</div>
                              <div style={{ color: "#34d399", fontSize: 16, fontWeight: 700, marginBottom: 8 }}>{fmtISK(latest)} ISK</div>
                              
                              {/* Simple sparkline */}
                              <div style={{ display: "flex", alignItems: "flex-end", height: 40, gap: 1 }}>
                                {prices.slice(-30).map((p, i) => {
                                  const height = range > 0 ? ((p - min) / range) * 100 : 50;
                                  return (
                                    <div 
                                      key={i} 
                                      style={{ 
                                        flex: 1, 
                                        height: `${height}%`, 
                                        background: "#22d3ee", 
                                        borderRadius: "1px 1px 0 0",
                                        opacity: 0.7
                                      }} 
                                    />
                                  );
                                })}
                              </div>
                            </div>
                          );
                        })()}
                        
                        {/* Current Market Prices */}
                        {itemDetails.currentPrice && (
                          <div style={{ marginBottom: 12, padding: 10, background: "#0a0f1a", border: "1px solid #1e293b", borderRadius: 4 }}>
                            <div style={{ color: "#334155", fontSize: 9, letterSpacing: 2, marginBottom: 8 }}>CURRENT JITA MARKET</div>
                            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 8, fontSize: 10 }}>
                              <div>
                                <div style={{ color: "#64748b", fontSize: 8, letterSpacing: 1, marginBottom: 2 }}>LOWEST SELL</div>
                                <div style={{ color: "#f87171", fontWeight: 600, fontSize: 11 }}>{fmtISK(itemDetails.currentPrice.sell)}</div>
                              </div>
                              <div>
                                <div style={{ color: "#64748b", fontSize: 8, letterSpacing: 1, marginBottom: 2 }}>MEDIAN</div>
                                <div style={{ color: "#22d3ee", fontWeight: 700, fontSize: 12 }}>{fmtISK(itemDetails.currentPrice.median)}</div>
                              </div>
                              <div>
                                <div style={{ color: "#64748b", fontSize: 8, letterSpacing: 1, marginBottom: 2 }}>HIGHEST BUY</div>
                                <div style={{ color: "#34d399", fontWeight: 600, fontSize: 11 }}>{fmtISK(itemDetails.currentPrice.buy)}</div>
                              </div>
                            </div>
                          </div>
                        )}
                        
                        {/* Volume Info */}
                        {itemDetails.priceHistory && itemDetails.priceHistory.length > 0 && (() => {
                          const latestDay = itemDetails.priceHistory[itemDetails.priceHistory.length - 1];
                          return (
                            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, marginBottom: 8 }}>
                              <div>
                                <div style={{ color: "#334155", fontSize: 8, letterSpacing: 1 }}>AVG VOLUME</div>
                                <div style={{ color: "#94a3b8", fontSize: 12, fontWeight: 600 }}>{fmtN(latestDay.volume)}</div>
                              </div>
                              <div>
                                <div style={{ color: "#334155", fontSize: 8, letterSpacing: 1 }}>ORDERS</div>
                                <div style={{ color: "#94a3b8", fontSize: 12, fontWeight: 600 }}>{latestDay.orderCount}</div>
                              </div>
                            </div>
                          );
                        })()}
                        
                        {/* Description */}
                        {itemDetails.description && (
                          <div style={{ color: "#475569", fontSize: 10, lineHeight: 1.5, marginTop: 10, paddingTop: 10, borderTop: "1px solid #1e293b" }}>
                            {itemDetails.description.substring(0, 200)}{itemDetails.description.length > 200 ? "..." : ""}
                          </div>
                        )}
                        
                        {/* BUILD ANALYSIS */}
                        {itemDetails.buildInfo && (
                          <div style={{ marginTop: 12, paddingTop: 12, borderTop: "1px solid #1e293b" }}>
                            <div style={{ color: "#22d3ee", fontSize: 10, fontWeight: 700, letterSpacing: 2, marginBottom: 8 }}>
                              ◉ BUILD REQUIREMENTS
                            </div>
                            
                            {/* Blueprint Status */}
                            <div style={{ marginBottom: 8, fontSize: 10 }}>
                              <div style={{ color: itemDetails.buildInfo.blueprintOwned ? "#34d399" : "#f87171", marginBottom: 2 }}>
                                {itemDetails.buildInfo.blueprintOwned ? "✓ Blueprint Owned" : "✗ Blueprint Not Owned"}
                              </div>
                              {itemDetails.buildInfo.canBuild && (
                                <div style={{ color: "#34d399" }}>✓ Can Build Now (all materials available)</div>
                              )}
                              {!itemDetails.buildInfo.canBuild && itemDetails.buildInfo.blueprintOwned && (
                                <div style={{ color: "#fbbf24" }}>⚠ Missing materials</div>
                              )}
                            </div>
                            
                            {/* Materials List */}
                            <div style={{ marginBottom: 10 }}>
                              <div style={{ color: "#334155", fontSize: 9, letterSpacing: 1, marginBottom: 4 }}>MATERIALS</div>
                              {itemDetails.buildInfo.materials.map((mat, i) => (
                                <div key={i} style={{ 
                                  display: "flex", 
                                  justifyContent: "space-between", 
                                  fontSize: 9, 
                                  padding: "3px 0",
                                  color: mat.shortage > 0 ? "#f87171" : "#34d399"
                                }}>
                                  <span style={{ flex: 1 }}>{mat.shortage > 0 ? "✗" : "✓"} {mat.name}</span>
                                  <span style={{ color: "#64748b", marginLeft: 8 }}>
                                    {fmtN(mat.have)}/{fmtN(mat.needed)}
                                  </span>
                                </div>
                              ))}
                            </div>
                            
                            {/* Cost Summary */}
                            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, fontSize: 10 }}>
                              <div>
                                <div style={{ color: "#334155", fontSize: 8, letterSpacing: 1 }}>BUILD COST</div>
                                <div style={{ color: "#94a3b8", fontWeight: 600, fontSize: 11 }}>{fmtISK(itemDetails.buildInfo.totalCost)}</div>
                              </div>
                              {itemDetails.currentPrice && (
                                <div>
                                  <div style={{ color: "#334155", fontSize: 8, letterSpacing: 1 }}>PROFIT</div>
                                  <div style={{ 
                                    color: itemDetails.buildInfo.profit > 0 ? "#34d399" : "#f87171", 
                                    fontWeight: 600,
                                    fontSize: 11
                                  }}>
                                    {fmtISK(itemDetails.buildInfo.profit)}
                                  </div>
                                </div>
                              )}
                            </div>
                            
                            {/* Profit Margin */}
                            {itemDetails.currentPrice && itemDetails.buildInfo.profitMargin !== 0 && (
                              <div style={{ marginTop: 6, fontSize: 9, color: "#64748b" }}>
                                Margin: {itemDetails.buildInfo.profitMargin.toFixed(1)}%
                              </div>
                            )}
                          </div>
                        )}
                      </>
                    ) : itemDetails?.error ? (
                      <div style={{ color: "#f87171", fontSize: 11, textAlign: "center", padding: 20 }}>Failed to load item details</div>
                    ) : (
                      <div style={{ color: "#334155", fontSize: 11, textAlign: "center", padding: 20 }}>Loading...</div>
                    )}
                  </div>
                )}

                {/* Top blueprints */}
                <div style={{ background: "#0a0f1a", border: "1px solid #1e293b", borderRadius: 4, padding: 10 }}>
                  <div style={{ color: "#22d3ee", fontSize: 10, fontWeight: 700, letterSpacing: 2, marginBottom: 8 }}>◈ TOP BLUEPRINTS</div>
                  <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
                    {topBps.map((bp, i) => (
                      <div key={i} style={{ borderBottom: i < topBps.length-1 ? "1px solid #0f172a" : "none", paddingBottom: 6 }}>
                        <div style={{ color: "#64748b", fontSize: 11, marginBottom: 2 }}>{bp.name}</div>
                        <div style={{ display: "flex", gap: 4 }}>
                          <span style={{ fontSize: 9, padding: "2px 4px", borderRadius: 2, background: "#0c4a6e", color: "#22d3ee" }}>{bp.runs}</span>
                          <span style={{ fontSize: 9, padding: "2px 4px", borderRadius: 2, background: "#052e16", color: "#34d399" }}>ME{bp.me}</span>
                          <span style={{ fontSize: 9, padding: "2px 4px", borderRadius: 2, background: "#411c00", color: "#fb923c" }}>TE{bp.te}</span>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>

                {/* Top materials */}
                <div style={{ background: "#0a0f1a", border: "1px solid #1e293b", borderRadius: 4, padding: 10, flex: 1, overflow: "auto" }}>
                  <div style={{ color: "#22d3ee", fontSize: 10, fontWeight: 700, letterSpacing: 2, marginBottom: 8 }}>◉ TOP MATERIALS</div>
                  <div style={{ display: "flex", flexDirection: "column", gap: 5 }}>
                    {topAssets.map(([name, qty], i) => (
                      <div key={i}>
                        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 2 }}>
                          <div style={{ color: "#64748b", fontSize: 11 }}>{name}</div>
                          <div style={{ color: "#fb923c", fontSize: 11, fontWeight: 700 }}>{fmtN(qty)}</div>
                        </div>
                        <div style={{ background: "#030712", height: 4, borderRadius: 2, overflow: "hidden" }}>
                          <div style={{ background: "#22d3ee", height: "100%", width: `${Math.min((qty / topAssets[0][1]) * 100, 100)}%` }} />
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            </div>
          );
        })()}
      </div>

      {/* Footer */}
      <div style={{ borderTop: "1px solid #0f172a", padding: "8px 20px", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
        <div style={{ color: "#1e293b", fontSize: 10, letterSpacing: 1 }}>F.O.R.G.E. · Read-only · No data stored</div>
        <div style={{ color: "#1e293b", fontSize: 10 }}>Not affiliated with CCP Games</div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
